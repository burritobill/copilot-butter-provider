name: Setup
description: Setup Bun, system tools, and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.9

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq bats shellcheck

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
