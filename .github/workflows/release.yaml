name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: changesets/action@v1
        id: changesets
        with:
          version: bun run ci:version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build release tarball
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

          # Create a fixed-name copy so the latest download URL is stable
          cp release/butter-copilot-"${VERSION}".tar.gz release/butter-copilot.tar.gz

          gh release create "$TAG" \
            release/butter-copilot.tar.gz \
            butter-copilot-"${VERSION}".vsix \
            --title "$TAG" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
