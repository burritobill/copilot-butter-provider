name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: changesets/action@v1
        id: changesets
        with:
          version: bun run ci:version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check if release needed
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: check_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_tag.outputs.exists == 'false'
        run: bun run release

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.check_tag.outputs.version }}"
          TAG="${{ steps.check_tag.outputs.tag }}"

          git tag "$TAG"
          git push origin "$TAG"

          # Create a fixed-name copy so the latest download URL is stable
          cp release/butter-copilot-"${VERSION}".tar.gz release/butter-copilot.tar.gz

          gh release create "$TAG" \
            release/butter-copilot.tar.gz \
            butter-copilot-"${VERSION}".vsix \
            --title "$TAG" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
